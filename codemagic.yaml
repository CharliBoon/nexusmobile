workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      vars:
        APP_ID: 4T56Y946KX.org.ims.nexusmobile
      ios_signing:
        distribution_type: development # Key for a development build
        bundle_identifier: org.ims.nexusmobile
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      #- name: Force iOS 15.0 Deployment Target
      #  script: |
      #    find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} +
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Update pods
        script: pod repo update
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: flutter build ipa --export-options-plist=$HOME/export_options.plist

        # Optional: you can switch to release if you need a development release
        # script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - charles.boon@imsi.org
        notify:
          success: true
          failure: true

  ios-appstore-workflow:
    name: iOS App Store Workflow
    environment:
      vars:
        APP_ID: 4T56Y946KX.org.ims.nexusmobile
      ios_signing:
        distribution_type: app_store # Uses IMS-Nexus-Release-Profile + a production certificate
        bundle_identifier: org.ims.nexusmobile
    scripts:
      - name: Set up code signing settings on Xcode project
        script:
          xcode-project use-profiles --custom-export-options='{"generateAppStoreInformation": true}'
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Update pods
        script: pod repo update
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: flutter build ipa --release --export-options-plist=$HOME/export_options.plist
    artifacts:
        - build/ios/ipa/*.ipa
        - build/ios/ipa/*.plist
        - /tmp/xcodebuild_logs/*.log
        - flutter_drive.log
    publishing:
      email:
        recipients:
          - charles.boon@imsi.org
        notify:
          success: true
          failure: true

  android-workflow:
    name: Android Workflow
    environment:
      vars:
        ANDROID_APP_ID: org.ims.nexusmobile
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android Debug APK
        script: flutter build apk --debug

      # Optional: build AAB for Play Store upload (uncomment if needed)
      # - name: Build Android App Bundle
      #   script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      # - build/app/outputs/bundle/release/app-release.aab   # if building AAB

    publishing:
      email:
        recipients:
          - charles.boon@imsi.org
        notify:
          success: true
          failure: false